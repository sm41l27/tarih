зоқ пен үшоқ — оғыз тайпаларының дәстүрлі топтары.","id":75},{"topic":2,"origin":"","sources":["oghuztribes"],"question":"Рашид ад-Дин дәстүрінде оғыздар неше тайпаға бөлінеді?","options":["24","10","7","92"],"explanation":"Рашид ад-Дин дәстүрінде — 24 тайпа; Қашғари тізімінде 22 тайпа аталады. Бұл деректерді ажыратыңыз.","id":76},{"topic":2,"origin":"","sources":["T:38","T:39"],"question":"Оғыздардың Жетісудан батысқа ығысуына қандай тайпалармен күрес әсер етті?","options":["Қарлұқтармен","Маңғыттармен","Барластармен","Жалайырлармен"],"explanation":"Қарлұқтармен күрес оғыздардың Сырдария мен Арал маңына көшуіне әсер етті.","id":77},{"topic":2,"origin":"","sources":["T:41"],"question":"1041 жылы Хорезмді алған оғыз билеушісі кім?","options":["Шахмәлік","Елюй Даши","Сатұқ Боғра","Өзбек хан"],"explanation":"Шахмәлік тұсында оғыздар Хорезмге жорық жасады.","id":78},{"topic":2,"origin":"","sources":["T:41"],"question":"Оғыз мемлекетінің ішкі дағдарысын пайдаланған күш қайсы?","options":["Селжұқтар","Түргештер","Жоңғарлар","Маңғыттар"],"explanation":"Селжұқтардың көтерілуі оғыз жабғулары билігінің әлсіреуімен қатар жүрді.","id":79},{"topic":2,"origin":"","sources":["T:42","T:43"],"question":"Қимақтардың негізгі қонысы қай өзен алабында болды?","options":["Ертіс","Жайық","Сырдария","Талас"],"explanation":"Қимақтар Ертіс бойында және Солтүстік-Шығыс Қазақстанда мекендеді.","id":80},{"topic":2,"origin":"","sources":["T:43"],"question":"Қимақ қағанының ордасы орналасқан қала қалай аталды?","options":["Имақия","Суяб","Тараз","Сайрам"],"explanation":"Дәрісте қимақтардың орталығы Имақия деп беріледі.","id":81},{"topic":2,"origin":"","sources":["T:42"],"question":"Қимақ тайпалар одағы Қазақстанның қай бөлігінде қалыптасты?","options":["Солтүстік-шығысында","Оңтүстік-батысында","Тек Маңғыстауда","Тек Аралдың оңтүстігінде"],"explanation":"Қимақ бірлестігінің өзегі Ертіс пен Алтайға іргелес өңір болды.","id":82},{"topic":2,"origin":"","sources":["kimakseven"],"question":"Қимақ федерациясының бастапқы құрамында неше негізгі тайпа аталады?","options":["Жеті","Он","Он екі","Жиырма төрт"],"explanation":"Деректе қимақ бірлестігін құраған жеті тайпа аталады.","id":83},{"topic":2,"origin":"","sources":["T:43"],"question":"Қимақтардың қалалары мен шаруашылығы туралы мәлімет берген араб географы кім?","options":["Әл-Идриси","Ибн Халдун","Әл-Бируни","Әл-Фараби"],"explanation":"Әл-Идриси қимақ қалалары және егіншілік жөнінде мәлімет қалдырған.","id":84},{"topic":2,"origin":"","sources":["T:43"],"question":"Қимақтардың дәстүрлі сеніміне қайсысы тән?","options":["Көк Тәңірі мен ата-баба рухын құрметтеу","Тек католиктік рәсімдер","Тек индуизм құдайлары","Тек конфуцийлік ғибадат"],"explanation":"Дәрісте қимақтардың тәңірлік және ата-баба рухына қатысты сенімдері көрсетілген.","id":85},{"topic":2,"origin":"","sources":["T:44"],"question":"Қимақ қағанатының орнына далалық аймақта қай бірлестік күшейді?","options":["Қыпшақ хандығы","Қарақытай мемлекеті","Түргеш қағанаты","Моғолстан"],"explanation":"Қыпшақ көсемдерінің дербестенуі жаңа саяси бірлестіктің өсуіне ықпал етті.","id":86},{"topic":2,"origin":"","sources":["T:44"],"question":"Қимақ қағанатының әлсіреуіндегі ішкі себеп қайсы?","options":["Жеке иеліктердің дербестікке ұмтылуы","Барлық тайпаның бір күнде көшуі","Моңғолдарға бірден қосылуы","Жібек саудасына толық тыйым салуы"],"explanation":"Жергілікті билеушілердің дербестенуі орталық билікті әлсіретті.","id":87},{"topic":2,"origin":"","sources":["T:45"],"question":"Қарахан мемлекетінің оқу әдебиетіндегі дәстүрлі мерзімі қандай?","options":["942–1212 жылдар","756–940 жылдар","603–704 жылдар","1428–1468 жылдар"],"explanation":"942–1212 жылдар Қарахан мемлекетінің жалпы хронологиялық шегі ретінде беріледі.","id":88},{"topic":2,"origin":"","sources":["T:46"],"question":"Қарахан әулетінің негізін қалаушы ретінде кім аталады?","options":["Сатұқ Боғра хан","Елюй Даши","Батый","Тоғылық Темір"],"explanation":"Дәрісте Сатұқ Боғра хан Қарахан мемлекетінің негізін қалаушы ретінде көрсетілген.","id":89},{"topic":2,"origin":"","sources":["karakhan"],"question":"Қарахан мемлекетінің қалыптасуына қатысқан негізгі тайпалар қатарын көрсетіңіз.","options":["Қарлұқ, шігіл, яғма","Маңғыт, барлас, меркіт","Қоңырат, алшын, тама","Қалмақ, торғауыт, хошауыт"],"explanation":"Қарлұқ, шігіл және яғма тайпалары Қарахан мемлекетінің этносаяси негізіне кірді.","id":90},{"topic":2,"origin":"","sources":["T:50"],"question":"Қарахан мемлекетінде ислам мемлекеттік дін ретінде қай жылы жарияланды?","options":["960 жылы","751 жылы","840 жылы","1312 жылы"],"explanation":"960 жыл — Қарахан мемлекетіндегі исламның мемлекеттік мәртебесіне қатысты дата.","id":91},{"topic":2,"origin":"","sources":["T:50"],"question":"960 жылы исламды мемлекеттік дін еткен Қарахан билеушісі кім?","options":["Мұса","Бумын","Үшлік","Барақ"],"explanation":"Мұса ханның билігі исламның мемлекеттік дін болып жариялануымен байланысты.","id":92},{"topic":2,"origin":"","sources":["T:49"],"question":"Қызметі үшін жерден салық жинау құқығын беру жүйесі қалай аталды?","options":["Иқта","Зекет","Ұшыр","Жасақ"],"explanation":"Иқта әскери немесе мемлекеттік қызметпен байланысты жер кірісін пайдалану құқығы болды.","id":93},{"topic":2,"origin":"","sources":["T:49"],"question":"Иқта иеленуші қалай аталды?","options":["Иқтадар","Мұзар","Жабғу","Басқақ"],"explanation":"Иқтадар өзіне берілген иеліктің кірісін пайдаланатын тұлға болды.","id":94},{"topic":2,"origin":"","sources":["T:49"],"question":"Діни мекемелерге арналған жер-мүлік қалай аталды?","options":["Уақф","Мүлік","Зекет","Қалан"],"explanation":"Уақф діни және қайырымдылық мақсаттарға арналған мүлік түрін білдіреді.","id":95},{"topic":2,"origin":"","sources":["T:49"],"question":"Қарахан дәуіріндегі жеке меншік жер атауы қайсы?","options":["Мүлік","Уақф","Жасақ","Соғым"],"explanation":"Дәрісте жеке меншік жер «мүлік» атауымен берілген.","id":96},{"topic":2,"origin":"","sources":["T:48"],"question":"Шығыс Қарахан иелігінің негізгі қалалары қайсы?","options":["Баласағұн мен Қашғар","Сарай мен Сарайшық","Янгикент пен Жент","Іскер мен Түмен"],"explanation":"Шығыс иелік Жетісу мен Қашғар аймағын қамтыды.","id":97},{"topic":2,"origin":"","sources":["T:47","T:49"],"question":"Батыс Қарахан иелігінің негізгі тарихи аймағы қалай аталды?","options":["Мауереннахр","Дешті Қыпшақ","Маңғыстау","Сарыарқа"],"explanation":"Мауереннахр Әмудария мен Сырдария аралығындағы отырықшы аймақты қамтыды.","id":98},{"topic":2,"origin":"","sources":["T:46"],"question":"Қарахандар мен Ғазнауилер арасындағы шекара қай өзенмен белгіленді?","options":["Әмудария","Ертіс","Жайық","Іле"],"explanation":"Дәрісте Әмудария екі мемлекет арасындағы шекара ретінде көрсетіледі.","id":99},{"topic":2,"origin":"","sources":["T:46"],"question":"999 жылы Қарахандар қай әулеттің Мауереннахрдағы билігін құлатты?","options":["Саманилердің","Шайбанилердің","Темір әулетінің","Аштарханилердің"],"explanation":"999 жылғы оқиға Саманилер билігінің аяқталуымен байланысты.","id":100},{"topic":2,"origin":"","sources":["T:51"],"question":"Қарахан мемлекетінің әлсіреуін пайдаланып Жетісуға келген күш қайсы?","options":["Қарақытайлар","Еділ қалмақтары","Жоңғарлар","Ноғайлар"],"explanation":"Ішкі қырқыс пен бөліну қарақытайлардың үстемдік орнатуына жағдай жасады.","id":101},{"topic":2,"origin":"","sources":["T:55"],"question":"Қарақытай мемлекетінің негізін қалаған кім?","options":["Елюй Даши","Күшлік","Тоғрыл","Шахмәлік"],"explanation":"Елюй Даши қидандардың батысқа қоныс аударған бөлігін басқарды.","id":102},{"topic":2,"origin":"","sources":["T:56"],"question":"Қарақытай билеушісінің «гурхан» атағы қандай мағынада қолданылды?","options":["Хандардың ханы","Әскердің онбасы","Қаланың қазысы","Салық жинаушы"],"explanation":"Гурхан Қарақытай мемлекетіндегі жоғарғы билеуші атағы болды.","id":103},{"topic":2,"origin":"","sources":["T:56"],"question":"Қарақытайлардың Ғұз Ордасы қай қалаға жақын орналасты?","options":["Баласағұнға","Сарай-Батуға","Сығанаққа","Іскерге"],"explanation":"Ғұз Орда Шу бойында, Баласағұнға жақын орналасқан.","id":104},{"topic":2,"origin":"","sources":["T:54"],"question":"Қарақытайлар Орталық Азияға келгенде қандай этнониммен де белгілі болды?","options":["Қидандар","Маңғыттар","Қарлұқтар","Алшындар"],"explanation":"Қарақытай атауы батысқа келген қидан тайпаларымен байланысты.","id":105},{"topic":2,"origin":"","sources":["kipchak"],"question":"«Дешті Қыпшақ» атауының мағынасы қандай?","options":["Қыпшақ даласы","Оғыз қаласы","Түркі тауы","Моңғол ордасы"],"explanation":"«Дешт» — дала; атау қыпшақтар қоныстанған кең далалық өңірге қатысты.","id":106},{"topic":3,"origin":"3:2","sources":["G:20"],"question":"Ақ Орданың күшеюі, әсіресе Ұрыс ханның билігі, қай кезеңге жатады?","options":["XIV ғасырдың екінші жартысы","XII ғасырдың бірінші жартысы","XVI ғасырдың екінші жартысы","XVII ғасырдың бірінші жартысы"],"explanation":"Ақ Орда XIV ғасырдың екінші жартысында, Ұрыс хан тұсында күшейді.","id":107},{"topic":3,"origin":"3:8","sources":["T:29","G:2"],"question":"Қай мемлекет моңғол шапқыншылығынан БҰРЫН өмір сүрді?","options":["Түргеш қағанаты","Ақ Орда","Ноғай Ордасы","Моғолстан"],"explanation":"Түргеш қағанаты VIII ғасырда, ал қалған мемлекеттер моңғол дәуірінен кейін өмір сүрді.","id":108},{"topic":3,"origin":"3:26","sources":["G:19"],"question":"Әмір Темірдің Тоқтамысқа қарсы жорықтары қай мемлекетті қатты әлсіретті?","options":["Алтын Орданы","Түргеш қағанатын","Оғыз мемлекетін","Қарлұқ мемлекетін"],"explanation":"Темір мен Тоқтамыс арасындағы соғыстар Алтын Орданың әлсіреуін тереңдетті.","id":109},{"topic":3,"origin":"4:4","sources":["mongoljetisu"],"question":"Жетісудағы халықтың бір бөлігінің моңғолдарды қолдауына не ықпал етті?","options":["Күшліктің діни қысымынан құтылуға үміт","Хорезмшахтың барлық салықты жоюы","Аварлардың жаңа жорығы","Түргеш қағанатының қайта құрылуы"],"explanation":"Күшліктің діни қысымы мен моңғолдардың бастапқы діни еркіндік саясаты халықтың ұстанымына әсер етті.","id":110},{"topic":3,"origin":"4:10","sources":["ermak"],"question":"Ермак жасағы Көшім әскерін жеңіп, Іскерді алған негізгі оқиға қай жылы болды?","options":["1582 жылы","1511 жылы","1552 жылы","1598 жылы"],"explanation":"Фотода кең аралық берілген. Іскердің алынуы 1582 жылмен нақтыланды; Сібірдің толық бағынуы бөлек үдеріс.","id":111},{"topic":3,"origin":"4:18","sources":["K:27"],"question":"Мауереннахрда Темір әулетінің билігі шамамен қай кезеңге дейін жалғасты?","options":["XVI ғасырдың басына дейін","XIII ғасырдың ортасына дейін","XIV ғасырдың басына дейін","XVII ғасырдың соңына дейін"],"explanation":"XVI ғасырдың басында Мұхаммед Шайбани Темір ұрпақтарын Мауереннахрдан ығыстырды.","id":112},{"topic":3,"origin":"4:20","sources":["baraq"],"question":"Ақ Ордадағы Барақ ханның билігі оқу әдебиетінде қай жылдармен беріледі?","options":["1423–1428","1404–1408","1400–1410","1415–1420"],"explanation":"Барақтың Ақ Ордадағы билігі 1423–1428 жылдармен көрсетіледі; оның Алтын Орда тағына таласы бөлек қарастырылады.","id":113},{"topic":3,"origin":"4:21","sources":["K:27","shaybani"],"question":"Мұхаммед Шайбани Темір әулетінің әлсіреуін пайдаланып алған қалалар қайсы?","options":["Самарқан мен Бұхара","Алмалық пен Сарайшық","Отырар мен Тараз","Түркістан мен Шымкент"],"explanation":"Шайбани XVI ғасырдың басында Мауереннахрдың Самарқан және Бұхара сияқты орталықтарын иеленді.","id":114},{"topic":3,"origin":"","sources":["G:3"],"question":"Шыңғыс ханның бастапқы есімі қандай?","options":["Темүжін","Батый","Елюй Даши","Тоғылық Темір"],"explanation":"Шыңғыс хан билікке дейін Темүжін есімімен белгілі болды.","id":115},{"topic":3,"origin":"","sources":["G:3"],"question":"Моңғол тайпаларының біріккен құрылтайында Темүжін қашан ұлы хан жарияланды?","options":["1206 жылы","1219 жылы","1227 жылы","1242 жылы"],"explanation":"1206 жылғы құрылтай Моңғол империясының құрылуымен байланысты.","id":116},{"topic":3,"origin":"","sources":["G:10"],"question":"Моңғол ақсүйектерінің маңызды мәселелерді шешетін жиыны қалай аталды?","options":["Құрылтай","Диуан","Медресе","Мәжілісхана"],"explanation":"Құрылтайда жоғарғы билік пен соғыс сияқты мәселелер талқыланды.","id":117},{"topic":3,"origin":"","sources":["G:9"],"question":"Моңғол әскерінің құрылымы қандай принципке сүйенді?","options":["Ондық жүйеге","Рулық жеребеге ғана","Қалалық цех жүйесіне","Тек жалдамалы роталарға"],"explanation":"Ондық жүйе әскер бөлімдерін бірізді басқаруға көмектесті.","id":118},{"topic":3,"origin":"","sources":["G:9"],"question":"Он мыңдық әскери бөлім қалай аталды?","options":["Түмен","Ондық","Жүздік","Мыңдық"],"explanation":"Түмен — он мың жауынгерлік әскери бөлім: 10 × 1000 = 10 000.","id":119},{"topic":3,"origin":"","sources":["G:9"],"question":"Моңғол жорықтарының жылдамдығын қамтамасыз еткен негізгі әскер түрі қайсы?","options":["Атты әскер","Теңіз флоты","Ауыр жаяу әскер","Теміржол әскері"],"explanation":"Атты әскердің қозғалғыштығы моңғол жорықтарында маңызды болды.","id":120},{"topic":3,"origin":"","sources":["G:10","G:11"],"question":"Шыңғыс әулетіне бөлінген иелік пен оған қарасты халық қандай ұғыммен аталды?","options":["Ұлыс","Уақф","Иқта","Болыс"],"explanation":"Ұлыс аумақты және оны мекендеген халықты қамтитын саяси иелік болды.","id":121},{"topic":3,"origin":"","sources":["G:11"],"question":"Шыңғыс ханның үлкен ұлы кім?","options":["Жошы","Шағатай","Үгедей","Төле"],"explanation":"Жошы — Шыңғыс ханның үлкен ұлы.","id":122},{"topic":3,"origin":"","sources":["G:5","G:25"],"question":"Моғолстан кейін қай ұлыстың шығыс бөлігінде қалыптасты?","options":["Шағатай ұлысының","Жошы ұлысының","Үгедей ұлысының","Төле иелігінің"],"explanation":"Моғолстанның құрылуы Шағатай ұлысының бөлінуімен байланысты.","id":123},{"topic":3,"origin":"","sources":["mongolinvasion"],"question":"1218 жылғы Отырар оқиғасы нені білдіреді?","options":["Моңғол сауда керуенінің ұсталып, қырғынға ұшырауын","Қазақ хандығының құрылуын","Қарахан мемлекетінің ислам қабылдауын","Әмір Темірдің таққа отыруын"],"explanation":"Керуен оқиғасы Шыңғыс ханның Хорезмге соғысына сылтау болды.","id":124},{"topic":3,"origin":"","sources":["mongolinvasion"],"question":"Моңғол шапқыншылығы қарсаңында Отырарды басқарған кім?","options":["Қайыр хан","Керей хан","Өзбек хан","Есенбұға хан"],"explanation":"Қайыр хан Отырар билеушісі және қала қорғанысын басқарған тұлға ретінде белгілі.","id":125},{"topic":3,"origin":"","sources":["G:8","mongolinvasion"],"question":"Шыңғыс ханның Хорезм мемлекетіне негізгі жорығы қай жылы басталды?","options":["1219 жылы","1206 жылы","1227 жылы","1236 жылы"],"explanation":"1219 жылы моңғол әскері Хорезм иеліктеріне басып кірді.","id":126},{"topic":3,"origin":"","sources":["mongolinvasion"],"question":"Отырарды қоршауға қалдырылған Шыңғыс ханның ұлдары кімдер?","options":["Шағатай мен Үгедей","Жошы мен Төле","Батый мен Берке","Өзбек пен Жәнібек"],"explanation":"Отырарды қоршауға Шағатай мен Үгедей бастаған әскер бөлінді.","id":127},{"topic":3,"origin":"","sources":["G:13"],"question":"Алтын Орданың негізін қалаған билеуші кім?","options":["Батый","Елюй Даши","Сатұқ Боғра","Әбілқайыр"],"explanation":"Батыйдың батыс жорықтарынан кейін Жошы ұлысының саяси қуаты артты.","id":128},{"topic":3,"origin":"","sources":["G:13"],"question":"Батый хан Шыңғыс ханға қандай туыстық қатынаста болды?","options":["Немересі, Жошының ұлы","Інісі","Әкесі","Шөбересі, Өзбектің ұлы"],"explanation":"Шыңғыс хан → Жошы → Батый — әулеттік сабақтастық.","id":129},{"topic":3,"origin":"","sources":["G:13"],"question":"Батыйдың Батысқа ірі жорықтары қай жылдарға жатады?","options":["1236–1242","1206–1210","1312–1342","1428–1468"],"explanation":"Дәрісте Батыс жорығы 1236–1242 жылдармен берілген.","id":130},{"topic":3,"origin":"","sources":["G:13"],"question":"Алтын Орданың алғашқы ірі астанасы қайсы?","options":["Сарай-Бату","Баласағұн","Суяб","Алмалық"],"explanation":"Сарай-Бату Еділ бойындағы саяси және сауда орталығы болды.","id":131},{"topic":3,"origin":"","sources":["G:15"],"question":"Алтын Орданың кейінгі астаналарының бірі қалай аталды?","options":["Сарай-Берке","Янгикент","Күнгіт","Қойлық"],"explanation":"Сарай-Берке Алтын Орданың маңызды қалалық орталықтарының бірі болды.","id":132},{"topic":3,"origin":"","sources":["G:13","G:17"],"question":"Алтын Орданың Сарай қалалары қай өзен бойымен байланысты?","options":["Еділмен","Ертіспен","Ілемен","Таласпен"],"explanation":"Алтын Орданың негізгі астаналық аймағы Төменгі Еділ бойында болды.","id":133},{"topic":3,"origin":"","sources":["G:13"],"question":"Алтын Ордаға қатысты қолданылған тарихи атау қайсы?","options":["Ұлық Ұлыс","Он оқ елі","Көшпелі өзбектер мемлекеті","Моғол ұлысы"],"explanation":"Дәрісте Алтын Орда «Ұлық Ұлыс» атауымен де берілген.","id":134},{"topic":3,"origin":"","sources":["G:16"],"question":"Берке хан дипломатиялық қатынас орнатқан Мысыр билеушісі кім?","options":["Бейбарыс","Салах ад-Дин","Құтб әд-Дин","Мұхаммед Шайбани"],"explanation":"Берке мен мәмлүк сұлтаны Бейбарыс арасында байланыс орнады.","id":135},{"topic":3,"origin":"","sources":["G:17","G:18"],"question":"Алтын Ордада исламның мемлекеттік мәртебесін нығайтқан хан кім?","options":["Өзбек хан","Бумын қаған","Үшлік қаған","Күшлік"],"explanation":"Өзбек хан тұсында ислам мемлекеттік дін ретінде орнықты.","id":136},{"topic":3,"origin":"","sources":["G:17"],"question":"Алтын Орданың күшеюімен байланысты XIV ғасырдағы билеушілер жұбы қайсы?","options":["Өзбек пен Жәнібек","Керей мен Жәнібек","Қасым мен Хақназар","Үшлік пен Сұлу"],"explanation":"Өзбек және оның ұлы Жәнібек тұсында Алтын Орда күшейді.","id":137},{"topic":3,"origin":"","sources":["G:14"],"question":"Алтын Ордадағы әскери істерге ықпалды жоғары лауазым қайсы?","options":["Беклербек","Атабек","Инал","Болыс"],"explanation":"Беклербек әскери және басқару істерінде маңызды орын алды.","id":138},{"topic":3,"origin":"","sources":["G:14"],"question":"Алтын Ордадағы орталық кеңсе және басқару органына қатысты атау қайсы?","options":["Диуан","Түмен","Жайлау","Рабат"],"expla  Ордадағы саяси ыдыраумен байланысты.","id":146},{"topic":3,"origin":"","sources":["G:20"],"question":"Ақ Орданың негізгі тарихи аумағы қалай аталды?","options":["Шығыс Дешті Қыпшақ","Батыс Еуропа","Оңтүстік Үндістан","Кіші Азия"],"explanation":"Ақ Орда Шығыс Дешті Қыпшақта өмір сүрді.","id":147},{"topic":3,"origin":"","sources":["G:20"],"question":"Ақ Орданың саяси орталығы қай қала болды?","options":["Сығанақ","Қарақорым","Бұхара","Суяб"],"explanation":"Сығанақ Сырдария бойындағы Ақ Орда орталығы болды.","id":148},{"topic":3,"origin":"","sources":["G:20"],"question":"Ақ Орда тарихымен байланысты Орда Ежен кімнің ұлы еді?","options":["Жошының","Шағатайдың","Үгедейдің","Төленің"],"explanation":"Орда Ежен — Жошының үлкен ұлы, оның шығыс иеліктерімен байланысты тұлға.","id":149},{"topic":3,"origin":"","sources":["K:18","K:26"],"question":"Қазақ хандығының негізін қалаған Жәнібек қай Ақ Орда ханының ұлы?","options":["Барақтың","Батыйдың","Өзбектің","Тоқтамыстың"],"explanation":"Жәнібек хан — Барақ ханның ұлы.","id":150},{"topic":3,"origin":"","sources":["G:27"],"question":"Моғолстандағы Тоғылық Темірдің хан сайлануы қай жылмен байланысты?","options":["1348 жылмен","1206 жылмен","1428 жылмен","1465 жылмен"],"explanation":"1348 жыл Моғолстанның құрылуындағы негізгі дата ретінде беріледі.","id":151},{"topic":3,"origin":"","sources":["G:27"],"question":"Моғолстанның алғашқы ханы кім?","options":["Тоғылық Темір","Әмір Темір","Мұхаммед Шайбани","Әбілқайыр"],"explanation":"Тоғылық Темірді дулат әмірлері қолдап, хан тағына отырғызды.","id":152},{"topic":3,"origin":"","sources":["G:25"],"question":"Моғолстанның астанасы қай қала болды?","options":["Алмалық","Сығанақ","Сарай-Бату","Іскер"],"explanation":"Алмалық Моғолстанның саяси орталығы ретінде көрсетіледі.","id":153},{"topic":3,"origin":"","sources":["G:27"],"question":"Моғолстанда дулат әмірлерінің мұрагерлік жоғары қызметі қалай аталды?","options":["Ұлысбегі","Гурхан","Атабек","Сюбашы"],"explanation":"Ұлысбегі қызметі дулат ақсүйектерінің ықпалын білдірді.","id":154},{"topic":3,"origin":"","sources":["G:28"],"question":"«Батпақ шайқасы» қай жылы өтті?","options":["1365 жылы","1380 жылы","1395 жылы","1457 жылы"],"explanation":"1365 жылғы шайқаста Ілияс Қожа Темір мен Хұсейннің күштеріне қарсы тұрды.","id":155},{"topic":3,"origin":"","sources":["G:28"],"question":"1365 жылғы Батпақ шайқасында жеңіске жеткен моғол билеушісі кім?","options":["Ілияс Қожа","Есенбұға","Уайс","Жүніс"],"explanation":"Дәрісте Ілияс Қожаның жеңісі көрсетілген.","id":156},{"topic":3,"origin":"","sources":["G:30"],"question":"Әбілқайыр хандығы қай жылы құрылды?","options":["1428 жылы","1348 жылы","1380 жылы","1465 жылы"],"explanation":"1428 жылы Әбілқайыр Шығыс Дешті Қыпшақтағы хандық билікке келді.","id":157},{"topic":3,"origin":"","sources":["G:30"],"question":"Әбілқайыр хандығының басқа атауы қандай?","options":["Көшпелі өзбектер мемлекеті","Он оқ елі","Ұйғыр қағанаты","Батыс Ляо"],"explanation":"Бұл атау XV ғасырдағы саяси-этникалық қауымға қатысты, қазіргі ұлт атауымен толық тең емес.","id":158},{"topic":3,"origin":"","sources":["G:32"],"question":"Ноғай Ордасының негізгі аумағы қай өзендер арасында болды?","options":["Еділ мен Жайық","Ертіс пен Есіл","Іле мен Шу","Талас пен Арыс"],"explanation":"Ноғай Ордасының өзегі Еділ–Жайық аралығында қалыптасты.","id":159},{"topic":3,"origin":"","sources":["nogay"],"question":"Ноғай Ордасының басты орталығы қай қала болды?","options":["Сарайшық","Баласағұн","Алмалық","Сауран"],"explanation":"Сарайшық Жайық бойындағы маңызды саяси және сауда орталығы еді.","id":160},{"topic":3,"origin":"","sources":["nogay"],"question":"Ноғай Ордасының қалыптасуымен тығыз байланысты тарихи тұлға кім?","options":["Едіге","Бумын","Үшлік","Керей"],"explanation":"Едіге мен оның ұрпақтары Ноғай Ордасының саяси қалыптасуында маңызды рөл атқарды.","id":161},{"topic":3,"origin":"","sources":["nogay"],"question":"Едігенің ұлы, Ноғай Ордасының дербестенуін жалғастырған билеуші кім?","options":["Нұраддин","Шахмәлік","Мұса хан","Құтлық"],"explanation":"Нұраддин тұсында Ноғай Ордасының дербестігі нығайды.","id":162},{"topic":3,"origin":"","sources":["G:31","G:32"],"question":"Ноғай Ордасындағы тайпалық ақсүйектердің кең тараған атағы қандай?","options":["Мырза","Гурхан","Қаған","Инал"],"explanation":"Ноғай мырзалары ұлыстарды басқарып, саяси өмірде ықпалды болды.","id":163},{"topic":3,"origin":"","sources":["K:18","G:25","G:32"],"question":"XV ғасыр ортасындағы дұрыс сәйкестікті табыңыз.","options":["Жетісу — Моғолстан; Еділ–Жайық — Ноғай Ордасы","Жетісу — Ноғай Ордасы; Еділ–Жайық — Моғолстан","Жетісу — Сібір хандығы; Еділ–Жайық — Қарахан мемлекеті","Жетісу — Алтын Орда; Еділ–Жайық — Түргеш қағанаты"],"explanation":"Дәрістердегі карталар Моғолстанның шығыста, Ноғай Ордасының батыста орналасқанын көрсетеді.","id":164},{"topic":4,"origin":"3:14","sources":["qasym"],"question":"Қазақ хандығы туралы мәлімет Батыс Еуропаға кеңірек қай хан тұсында тарады?","options":["Қасым хан","Мамаш хан","Жәнібек хан","Тахир хан"],"explanation":"Қасым хан тұсында хандықтың халықаралық беделі өсіп, ол Еуропаға таныла түсті.","id":165},{"topic":4,"origin":"3:15","sources":["taukelaw"],"question":"Дәстүрлі деректерде Тәуке ханның «Жеті жарғыны» талқылаған кеңесі қай жермен байланыстырылады?","options":["Күлтөбе","Бестөбе","Қостөбе","Жаңатөбе"],"explanation":"Күлтөбе кеңестері Тәуке хан мен билердің заңдық қызметімен байланыстырылады.","id":166},{"topic":4,"origin":"3:19","sources":["tauekel"],"question":"XVI ғасырдың соңында өзін «қазақтар мен қалмақтардың патшасы» деп атаған хан кім?","options":["Тәуекел","Есім","Хақназар","Шығай"],"explanation":"Тәуекелдің Мәскеуге жолдаған грамотасындағы атауы деректе расталады. Фотодағы туыстарын тағайындау тұжырымы осылай нақтыланды.","id":167},{"topic":4,"origin":"3:25","sources":["reform1854"],"question":"Хан мен сұлтан болуға тектік құқығы бар Шыңғыс ұрпақтары қазақ қоғамында қалай аталды?","options":["Төрелер","Қожалар","Төлеңгіттер","Жатақтар"],"explanation":"Фотодағы артықшылықтардың аяқталу мерзімі жалпылама берілген. Мұнда нақты әлеуметтік атау сұралады.","id":168},{"topic":4,"origin":"4:12","sources":["K:6","K:18"],"question":"VI ғасырдан XV ғасырға дейінгі түркілік этникалық үдеріс шамамен қанша уақытты қамтиды?","options":["Мың жылға жуық","Үш мың жылға жуық","Бес мың жылға жуық","Жүз жылға жуық"],"explanation":"VI–XV ғасырлар аралығы шамамен тоғыз–он ғасыр. Бұл бүкіл қазақ этногенезінің толық ұзақтығы емес.","id":169},{"topic":4,"origin":"4:13","sources":["tauke"],"question":"«Жеті жарғыны» жасаумен дәстүрлі түрде байланыстырылатын үш би кім?","options":["Төле, Қазыбек, Әйтеке","Төле, Майқы, Бала би","Қазыбек, Сырым, Балқы","Әйтеке, Қотан, Асан қайғы"],"explanation":"Тәуке ханның заңдық қызметінде Төле, Қазыбек және Әйтеке билердің орны ерекше аталады.","id":170},{"topic":4,"origin":"4:17","sources":["tauekel"],"question":"Хақназар ханның билік еткен жылдарын көрсетіңіз.","options":["1538–1580","1480–1490","1500–1511","1512–1521"],"explanation":"Оқу әдебиетіндегі кең тараған мерзім — 1538–1580 жылдар.","id":171},{"topic":4,"origin":"4:25","sources":["tauekel"],"question":"XVI ғасырдың соңында қазақ ықпалын кеңейтіп, 1598 жылы Мауереннахрға жорық жасаған хан кім?","options":["Тәуекел","Тахир","Бұрындық","Шығай"],"explanation":"Фотодағы ноғай-башқұрт шекарасына ықпал туралы кең тұжырым нақты 1598 жылғы оқиғамен берілді.","id":172},{"topic":4,"origin":"","sources":["K:19"],"question":"Қазақ хандығының құрылуы мектеп курсында қай жылдармен белгіленеді?","options":["1465–1466 жылдар","1428–1429 жылдар","1511–1512 жылдар","1598–1599 жылдар"],"explanation":"Дулати көрсеткен хижраның 870 жылы негізінде 1465–1466 жылдар қабылданған.","id":173},{"topic":4,"origin":"","sources":["K:2","K:26"],"question":"Қазақ хандығының негізін қалаған сұлтандар кімдер?","options":["Керей мен Жәнібек","Есім мен Тұрсын","Абылай мен Әбілқайыр","Тәуке мен Қайып"],"explanation":"Керей мен Жәнібек бастаған тайпалардың бөлініп көшуі жаңа хандықтың құрылуына әкелді.","id":174},{"topic":4,"origin":"","sources":["K:2"],"question":"Керей мен Жәнібекті қабылдап, қоныс берген Моғолстан ханы кім?","options":["Есенбұға","Әмір Темір","Мұхаммед Шайбани","Өзбек хан"],"explanation":"Есенбұға оларға Моғолстанның батыс бөлігінен жер берді.","id":175},{"topic":4,"origin":"","sources":["K:21"],"question":"Қазақ хандығының алғашқы аумағы қай өңірде қалыптасты?","options":["Батыс Жетісуда, Шу мен Талас аралығында","Еділдің төменгі ағысында","Ертістің солтүстік жағалауында","Маңғыстау түбегінде"],"explanation":"Шу–Талас өңірі мен Қозыбасы хандықтың бастапқы саяси ортасымен байланысты.","id":176},{"topic":4,"origin":"","sources":["K:21"],"question":"Қазақ хандығының құрылуымен байланысты жер атауы қайсы?","options":["Қозыбасы","Қарақорым","Сарай-Бату","Имақия"],"explanation":"Қозыбасы Батыс Жетісудағы хандықтың құрылу тарихында аталады.","id":177},{"topic":4,"origin":"","sources":["K:26"],"question":"Қазақ хандығының алғашқы ханы кім деп есептеледі?","options":["Керей","Бұрындық","Қасым","Тәуке"],"explanation":"Алғаш хан сайланған — Керей, ал Жәнібек хандықты құруға қатар қатысқан.","id":178},{"topic":4,"origin":"","sources":["K:26"],"question":"Керей ханның әкесі кім?","options":["Болат сұлтан","Барақ хан","Қасым хан","Шығай хан"],"explanation":"Берілген дәрісте Керей Болат сұлтанның баласы ретінде көрсетілген.","id":179},{"topic":4,"origin":"","sources":["K:18"],"question":"Керей мен Жәнібек қай билеушінің мемлекетінен бөлініп көшті?","options":["Әбілқайыр ханның","Едіге бидің","Бейбарыс сұлтанның","Сатұқ Боғра ханның"],"explanation":"Олар Әбілқайыр билеген Шығыс Дешті Қыпшақтан Моғолстанға көшті.","id":180},{"topic":4,"origin":"","sources":["baraq"],"question":"1457 жылы Әбілқайыр ханның беделін әлсіреткен оқиға қайсы?","options":["Ойраттардан жеңілуі","Қазан қаласының алынуы","Атлах шайқасының аяқталуы","Орбұлақ шайқасының өтуі"],"explanation":"Сығанақ маңындағы жеңіліс Әбілқайыр билігіне наразылықты күшейтті.","id":181},{"topic":4,"origin":"","sources":["baraq"],"question":"Әбілқайыр хан қай жылы қайтыс болды?","options":["1468 жылы","1428 жылы","1500 жылы","1538 жылы"],"explanation":"Оның өлімінен кейін мемлекетіндегі билік үшін күрес күшейді.","id":182},{"topic":4,"origin":"","sources":["K:19"],"question":"Дулатидің мәліметінде Керей мен Жәнібекке жиналған адамдар саны қаншаға жеткен?","options":["200 мыңға","20 мыңға","2 миллионға","800 мыңға"],"explanation":"Дәрісте келтірілген «Тарих-и Рашиди» мәліметінде 200 мың адам аталады.","id":183},{"topic":4,"origin":"","sources":["K:19","dulati"],"question":"Қазақ хандығының құрылуы туралы маңызды мәлімет сақталған еңбек қайсы?","options":["«Тарих-и Рашиди»","«Диуани лұғат ат-түрік»","«Құтадғу білік»","«Мұхаббатнама»"],"explanation":"Мұхаммед Хайдар Дулати еңбегінде Керей мен Жәнібектің көшуі және хандықтың құрылуы баяндалған.","id":184},{"topic":4,"origin":"","sources":["K:19"],"question":"Дулати қазақ сұлтандары билігінің басталуын хижраның қай жылымен байланыстырады?","options":["870 жылымен","552 жылымен","960 жылымен","1206 жылымен"],"explanation":"Хижраның 870 жылы қазіргі күнтізбеде 1465–1466 жылдарға сәйкес келеді.","id":185},{"topic":4,"origin":"","sources":["K:18","K:30"],"question":"Қазақ хандығының құрылуына ықпал еткен басты алғышарт қайсы?","options":["Қазақ тайпаларының саяси бірігуге ұмтылысы","Барлық қалалардың теңіз портына айналуы","Көшпелі шаруашылықтың толық жойылуы","Қазақстанда зауыт өндірісінің үстем болуы"],"explanation":"Этникалық, аумақтық және шаруашылық жақындасу саяси бірлестік құруға негіз болды.","id":186},{"topic":4,"origin":"","sources":["K:5","K:18"],"question":"«Этногенез» ұғымы нені білдіреді?","options":["Халықтың қалыптасу үдерісін","Мемлекеттің салық жинау жүйесін","Қамал салу әдісін","Әскерді жүздікке бөлуді"],"explanation":"Этногенез тайпалар мен қауымдардың ұзақ тарихи дамуда халық болып қалыптасуын зерттейді.","id":187},{"topic":4,"origin":"","sources":["K:4","K:13"],"question":"«Этноним» дегеніміз не?","options":["Халықтың атауы","Ел астанасының атауы","Билеушінің лауазымы","Ақша бірлігінің атауы"],"explanation":"«Қазақ» — этноним, ал «хан» — билеуші лауазымы.","id":188},{"topic":4,"origin":"","sources":["K:13"],"question":"Дәрісте «қазақ» атауының кең тараған тарихи түсіндірмесі қалай берілген?","options":["Еркін, ерікті адам","Қамалдың күзетшісі","Салық жинаушы","Теңіз саудагері"],"explanation":"Бұл — атаудың кең тараған түсіндірмесі; сөздің шығуы туралы бірнеше ғылыми пікір бар.","id":189},{"topic":4,"origin":"","sources":["K:6","K:18"],"question":"Қазақ тілі қай тілдік топқа жатады?","options":["Түркі тілдеріне","Славян тілдеріне","Роман тілдеріне","Семит тілдеріне"],"explanation":"Қазақ халқының қалыптасуына түркі тілдес тайпалардың ортақ тілдік ортасы ықпал етті.","id":190},{"topic":4,"origin":"","sources":["K:12","K:16"],"question":"Ұлы жүздің тарихи қоныстары негізінен қай өңірлермен байланысты?","options":["Жетісу және Оңтүстік Қазақстан","Батыс Қазақстан мен Еділ бойы","Орталық және Солтүстік Қазақстан","Тек Маңғыстау түбегі"],"explanation":"Жүздердің қоныстары уақыт өте өзгергенімен, Ұлы жүз негізінен оңтүстік пен оңтүстік-шығыста орналасқан.","id":191},{"topic":4,"origin":"","sources":["K:12","K:16"],"question":"Орта жүздің тарихи қоныстары негізінен қай өңірлерді қамтыды?","options":["Орталық, Солтүстік және Шығыс Қазақстанды","Тек Еділдің төменгі ағысын","Тек Шу–Талас аңғарын","Тек Маңғыстау мен Үстіртті"],"explanation":"Орта жүздің қоныстары Сарыарқа, Ертіс өңірі және солтүстік-шығыс аймақтармен байланысты.","id":192},{"topic":4,"origin":"","sources":["K:12","K:16"],"question":"Кіші жүздің тарихи қоныстары негізінен қай аймақта болды?","options":["Батыс Қазақстанда","Шығыс Түркістанда","Алтайдың шығысында","Тек Іле аңғарында"],"explanation":"Кіші жүздің негізгі аумағы Қазақстанның батысы мен Арал–Каспий өңірлерін қамтыды.","id":193},{"topic":4,"origin":"","sources":["K:15"],"question":"Алаштың үш ұлы туралы әңгіме деректің қай түріне жатады?","options":["Шежірелік аңызға","Ресми салық тізіміне","Археологиялық қазба есебіне","Дипломатиялық шартқа"],"explanation":"Шежірелік аңыз тарихи жадты көрсетеді; оны дәл даталанған ресми құжатпен теңестіруге болмайды.","id":194},{"topic":4,"origin":"","sources":["K:28"],"question":"Қазақ хандары үшін Сыр бойындағы қалаларды иелену неліктен маңызды болды?","options":["Сауда, егіншілік және қысқы қоныстармен байланысы үшін","Мұхитқа тікелей шығу үшін","Кеме жасау өнеркәсібі үшін","Солтүстік Еуропаны басқару үшін"],"explanation":"Сыр өңіріндегі қалалар дала мен отырықшы аймақтарды жалғап, хандықтың экономикалық тірегін күшейтті.","id":195},{"topic":4,"origin":"","sources":["K:27"],"question":"Қазақ хандарының XV ғасыр соңындағы Сыр қалалары үшін басты қарсыласы кім болды?","options":["Мұхаммед Шайбани","Елюй Даши","Тоныкөк","Бейбарыс"],"explanation":"Мұхаммед Шайбани Сыр бойындағы қалаларды өз билігіне алуға ұмтылды.","id":196},{"topic":4,"origin":"","sources":["K:27"],"question":"Дәрісте 1470 жылғы жорықта Керей хан қай қалаға бағытталған?","options":["Түркістанға","Қазанға","Сарай-Беркеге","Қашғарға"],"explanation":"Берілген дәрісте Керейдің Түркістанға, Жәнібектің Созаққа жорығы көрсетілген.","id":197},{"topic":4,"origin":"","sources":["K:27"],"question":"Дәрістегі 1470 жылғы жорықта Жәнібек хан қай қалаға шабуыл жасаған?","options":["Созаққа","Таразға","Бұхараға","Отырарға"],"explanation":"Бұл жорық Сыр бойындағы қалалар үшін күрестің бір кезеңі болды.","id":198},{"topic":4,"origin":"","sources":["K:28"],"question":"Сырдария өңірі үшін күресте аталған қалалар қатарын көрсет.","options":["Сығанақ, Сауран, Созақ","Сарай-Бату, Қазан, Астрахан","Суяб, Имақия, Қарақорым","Баласағұн, Қашғар, Бейжің"],"explanation":"Сығанақ, Сауран және Созақ Қазақ хандығының оңтүстіктегі саяси-экономикалық мүддесімен байланысты.","id":199},{"topic":4,"origin":"","sources":["K:3"],"question":"Дәрісте Бұрындық ханның билік кезеңі қалай көрсетілген?","options":["1480–1511 жылдар","1465–1466 жылдар","1538–1580 жылдар","1582–1598 жылдар"],"explanation":"Бұрындық Керейдің ұлы болған; дәрісте оның билігі 1480–1511 жылдармен берілген.","id":200},{"topic":4,"origin":"","sources":["qasym"],"question":"Қасым ханның әкесі кім?","options":["Жәнібек хан","Шығай хан","Тәуке хан","Абылай хан"],"explanation":"Қасым — Қазақ хандығын құрған Жәнібек ханның ұлы.","id":201},{"topic":4,"origin":"","sources":["qasym"],"question":"Қасым хан тұсындағы құқықтық ережелер қалай аталады?","options":["«Қасым ханның қасқа жолы»","«Есім ханның ескі жолы»","«Жеті жарғы»","«Сібір қырғыздары туралы жарғы»"],"explanation":"Қасқа жол — Қасым хан дәуірімен байланысты әдет-ғұрып құқығы ережелерінің атауы.","id":202},{"topic":4,"origin":"","sources":["tauekel"],"question":"Хақназар хан қай ханның ұлы болған?","options":["Қасым ханның","Керей ханның","Шығай ханның","Тәуке ханның"],"explanation":"Хақназар Қасым ханның ұлы ретінде хандықтың әлсіреген бірлігін қайта нығайтты.","id":203},{"topic":4,"origin":"","sources":["tauekel"],"question":"Хақназардан кейін, 1580–1582 жылдары билік еткен хан кім?","options":["Шығай","Бұрындық","Есім","Тәуке"],"explanation":"Шығайдан кейін оның ұлы Тәуекел билікке келді.","id":204},{"topic":4,"origin":"","sources":["tauekel"],"question":"Тәуекел хан 1594 жылы Мәскеуге кім бастаған елшілік жіберді?","options":["Құл-Мұхаммед","А. Тевкелев","И. Кириллов","Ф. Шербина"],"explanation":"Құл-Мұхаммед елшілігі дипломатиялық байланыс пен Ораз-Мұхаммедті босату мәселесін көтерді.","id":205},{"topic":4,"origin":"","sources":["tauekel"],"question":"1594 жылғы қазақ елшілігі босатуды сұраған сұлтан кім?","options":["Ораз-Мұхаммед","Әбілмәмбет","Бөкей","Кенесары"],"explanation":"Ораз-Мұхаммед 1588 жылы тұтқынға түсіп, Мәскеуге жеткізілген еді.","id":206},{"topic":4,"origin":"","sources":["tauekel"],"question":"Тәуекелден кейін Қазақ хандығын кім басқарды?","options":["Есім хан","Қасым хан","Хақназар хан","Керей хан"],"explanation":"1598 жылы Тәуекел қайтыс болғаннан кейін билікке оның інісі Есім келді.","id":207},{"topic":4,"origin":"","sources":["tauekel"],"question":"Есім ханмен байланысты құқықтық ережелердің атауы қайсы?","options":["«Есім ханның ескі жолы»","«Жеті жарғы»","«Ұлы жасақ»","«Қасым ханның қасқа жолы»"],"explanation":"Ескі жол Есім хан тұсындағы әдет-ғұрып нормаларын реттеумен байланысты.","id":208},{"topic":4,"origin":"","sources":["tauke"],"question":"Тәуке хан дәуірінде жүйеленген заңдар жинағы қалай аталады?","options":["«Жеті жарғы»","«Құтадғу білік»","«Тарих-и Рашиди»","«Диуани хикмет»"],"explanation":"«Жеті жарғы» қоғамның жер, жесір, құн және өзге дауларын реттейтін әдеттік құқықпен байланысты.","id":209},{"topic":4,"origin":"","sources":["K:30"],"question":"Қазақ хандығы құрылуының негізгі тарихи маңызы қандай?","options":["Қазақ тайпаларының дербес мемлекетке бірігуі","Түрік қағанатының алғаш құрылуы","Алтын Орданың Еуропаға жорық бастауы","Жоңғар хандығының құрылуы"],"explanation":"Хандықтың құрылуы қазақ халқының саяси тұтастығын нығайтты.","id":210},{"topic":4,"origin":"","sources":["K:18","K:21"],"question":"Оқиғаларды дұрыс ретпен орналастырған қатарды таңда.","options":["Әбілқайырдан бөліну → Жетісуға көшу → хандықтың құрылуы","Хандықтың құрылуы → Атлах шайқасы → Жетісуға көшу","Жетісуға көшу → Жоңғар хандығының құрылуы → Керейдің билігі","Қасымның билігі → Әбілқайырдан бөліну → Батыс Түрік қағанаты"],"explanation":"Алдымен бөлініп көшу жүріп, кейін Жетісуда дербес хандық қалыптасты.","id":211},{"topic":4,"origin":"","sources":["K:25","K:30"],"question":"Қазақ хандығы халқының негізін қандай қауымдар құрады?","options":["Қыпшақ, арғын, найман, қоңырат және басқа жергілікті түркі тайпалары","Тек Балқаннан көшкен тайпалар","Тек Скандинавия теңізшілері","Тек Араб түбегінің тұрғындары"],"explanation":"Жергілікті тайпалардың ұзақ тарихи жақындасуы қазақ халқының қалыптасуына негіз болды.","id":212},{"topic":5,"origin":"3:3","sources":["bukhar"],"question":"Абылай ханның белгілі кеңесшісі болған жырау кім?","options":["Бұқар жырау","Қотан жырау","Сыпыра жырау","Доспамбет жырау"],"explanation":"Бұқар жырау Абылайға ел бірлігі мен сыртқы саясат жөнінде кеңес берген.","id":213},{"topic":5,"origin":"3:5","sources":["silk"],"question":"Ежелгі лазурит жолымен Бадахшаннан тас қай аймақтарға жеткізілді?","options":["Иран, Месопотамия, Мысыр және Сирияға","Скандинавия мен Исландияға","Корея мен Жапонияға","Камчатка мен Сахалинге"],"explanation":"Лазурит пен нефрит жолдары — бөлек бағыттар. Фотода екеуі біріктірілген, мұнда лазурит жолы нақтыланды.","id":214},{"topic":5,"origin":"3:6","sources":["bakyr"],"question":"Қожа Ахмет Ясауидің шәкірті ретінде белгілі сопы ақын кім?","options":["Сүлеймен Бақырғани","Махмұд Қашғари","Мұхаммед Хайдар Дулати","Қадырғали Жалайыри"],"explanation":"Сүлеймен Бақырғани Ясауи дәстүрін жалғастырған сопы ақын ретінде белгілі.","id":215},{"topic":5,"origin":"3:10","sources":["textbookculture"],"question":"Қазақтардың жүннен жіп иіріп, бояп, мата тоқуын сипаттаған зерттеуші кім?","options":["А. Гейнс","Ф. фон Шварц","А. Брем","Н. Пржевальский"],"explanation":"Оқулықтағы осы сипаттама А. Гейнске тиесілі. Интернеттегі кейбір тесттерде авторы шатастырылған.","id":216},{"topic":5,"origin":"3:17","sources":["nogayepic"],"question":"Ноғайлы дәуірімен байланысты эпостар қатарын көрсетіңіз.","options":["«Едіге», «Қамбар батыр», «Ер Тарғын»","«Манас», «Илиада», «Одиссея»","«Шахнама», «Махабхарата», «Рамаяна»","«Бабырнама», «Тарих-и Рашиди», «Шежірелер жинағы»"],"explanation":"Ноғайлы жырлары қазақ және басқа түркі халықтарының ортақ эпикалық мұрасында сақталған.","id":217},{"topic":5,"origin":"3:20","sources":["bukhar"],"question":"Абылай дәуіріндегі Бұқар жыраудың әкесінің аты кім?","options":["Қалқаман","Сүйініш","Тіленші","Қожаберген"],"explanation":"Бұқар Қалқаманұлы — Абылай дәуірінің жырауы. Фотодағы кеңесші туралы қайталанған сұрақ осы қосымша дерекпен берілді.","id":218},{"topic":5,"origin":"3:22","sources":["goldliterature"],"question":"«Мұхаббатнама» поэмасының авторы кім?","options":["Хорезми","Низами","Құтб","Сайф Сараи"],"explanation":"Хорезмидің «Мұхаббатнамасы» — Алтын Орда дәуірінің әдеби мұрасы.","id":219},{"topic":5,"origin":"3:23","sources":["aqyrtas"],"question":"Ақыртас сарай кешені Қазақстанның қай облысында орналасқан?","options":["Жамбыл облысында","Қызылорда облысында","Маңғыстау облысында","Ақмола облысында"],"explanation":"Ақыртас Тараздың шығысында, Жамбыл облысында орналасқан.","id":220},{"topic":5,"origin":"3:30","sources":["dulati"],"question":"Мұхаммед Хайдар Дулати қай жылдары өмір сүрді?","options":["1499–1551","1455–1500","1500–1560","1511–1572"],"explanation":"1499–1551 жылдар — Дулатидің өмір сүрген мерзімі.","id":221},{"topic":5,"origin":"4:3","sources":["barbaro"],"question":"Көшпелілердің арба үстіндегі үйлерін сипаттаған венециялық саяхатшы кім?","options":["Иосафат Барбаро","Густав Гасфорт","Александр Гейнс","Виктор Дандевиль"],"explanation":"Барбаро көшпелілердің арбамен тасылатын баспаналары туралы мәлімет қалдырған.","id":222},{"topic":5,"origin":"4:15","sources":["bakyr"],"question":"Сүлеймен Бақырғани халық арасында қандай атпен белгілі?","options":["Хакім ата","Ұлықбек","Дарабоз","Асан қайғы"],"explanation":"«Хакім ата» — Сүлеймен Бақырғанидың кең тараған атауы.","id":223},{"topic":5,"origin":"4:19","sources":["kashgari"],"question":"Түркі тілдерін салыстыра зерттеген «Диуани лұғат ат-түрк» авторы кім?","options":["Махмұд Қашғари","Әл-Бируни","Жүсіп Баласағұни","Ахмет Ясауи"],"explanation":"Қашғари түркі тілдері сөздігін жасап, түркітанудың ерте ғылыми негізін қалады.","id":224},{"topic":5,"origin":"4:26","sources":["T:37"],"question":"Оғыздардың аңыздық тарихы баяндалатын эпикалық шығарма қайсы?","options":["«Оғызнама»","«Бабырнама»","«Құпия шежіре»","«Тарих-и Рашиди»"],"explanation":"«Оғызнама» оғыздардың аңыздары мен тарихи жадын сақтаған эпикалық мұра.","id":225},{"topic":5,"origin":"4:28","sources":["shoqan"],"question":"Қазақ өміріндегі малдың маңызын «мал-жан аман ба?» амандасуымен байланыстырған ғалым кім?","options":["Шоқан Уәлиханов","Абай Құнанбайұлы","Шәкәрім Құдайбердіұлы","Әлихан Бөкейхан"],"explanation":"Шоқанның этнографиялық пайымында амандасу салты мен мал шаруашылығының байланысы көрсетіледі.","id":226},{"topic":5,"origin":"4:29","sources":["alasha"],"question":"Қаракеңгірдің оң жағасында орналасқан, далалық сәулет дәстүрінің ескерткіші қайсы?","options":["Алаша хан кесенесі","Айша бибі кесенесі","Ақыртас кешені","Білеулі керуен сарайы"],"explanation":"Фотодағы XIV–XV ғасыр мерзімі жөнінде зерттеулер әртүрлі. Сондықтан мұнда даусыз орналасуы сұралды.","id":227},{"topic":5,"origin":"","sources":["balasagun"],"question":"«Құтадғу білік» («Құтты білік») дастанының авторы кім?","options":["Жүсіп Баласағұни","Махмұд Қашғари","Мұхаммед Хайдар Дулати","Сайф Сараи"],"explanation":"Жүсіп Баласағұнидің дастаны білім, әділет және ел басқару мәселелеріне арналған.","id":228},{"topic":5,"origin":"","sources":["balasagun"],"question":"«Құтты білік» қай жылдары жазылған?","options":["1069–1070 жылдары","552–553 жылдары","1219–1220 жылдары","1465–1466 жылдары"],"explanation":"Дастан Қарахан дәуірінде жазылып, Қашғарда аяқталған.","id":229},{"topic":5,"origin":"","sources":["balasagun"],"question":"«Құтты білік» қай мемлекеттің мәдени өрлеуімен байланысты?","options":["Қарахан мемлекетімен","Жоңғар хандығымен","Бөкей Ордасымен","Сібір хандығымен"],"explanation":"XI ғасырдағы Қарахан мемлекеті түркі тіліндегі жазба мәдениеттің маңызды ортасы болды.","id":230},{"topic":5,"origin":"","sources":["yugneki"],"question":"«Ақиқат сыйы» шығармасының авторы кім?","options":["Ахмет Йүгінеки","Қожа Ахмет Ясауи","Жүсіп Баласағұни","Хорезми"],"explanation":"Ахмет Йүгінекидің дидактикалық туындысы білім мен адамгершілікті дәріптейді.","id":231},{"topic":5,"origin":"","sources":["yasawibook"],"question":"Қожа Ахмет Ясауимен байланысты хикметтер жинағы қалай аталады?","options":["«Диуани хикмет»","«Құтадғу білік»","«Мұхаббатнама»","«Тарих-и Рашиди»"],"explanation":"«Диуани хикмет» түркі сопылық әдебиетінің маңызды мұрасы саналады.","id":232},{"topic":5,"origin":"","sources":["yasawim"],"question":"Қожа Ахмет Ясауи кесенесі қай қалада орналасқан?","options":["Түркістанда","Таразда","Сарайшықта","Оралда"],"explanation":"Кесене ежелгі Ясы, қазіргі Түркістан қаласында тұр.","id":233},{"topic":5,"origin":"","sources":["yasawim"],"question":"Қожа Ахмет Ясауидің қазіргі үлкен кесенесін салдыруға бұйрық берген билеуші кім?","options":["Әмір Темір","Сатұқ Боғра хан","Мұқан қаған","Абылай хан"],"explanation":"Кесене Әмір Темір дәуіріндегі сәулет өнерінің әйгілі үлгісі.","id":234},{"topic":5,"origin":"","sources":["yasawim"],"question":"ЮНЕСКО сипаттамасында Ясауи кесенесінің құрылысы қай аралықпен берілген?","options":["1389–1405 жылдар","960–970 жылдар","1219–1225 жылдар","1731–1740 жылдар"],"explanation":"Бұл мерзім қазіргі үлкен кесененің салынуына қатысты; Ясауи XII ғасырда өмір сүрген.","id":235},{"topic":5,"origin":"","sources":["farabi"],"question":"Әбу Насыр әл-Фарабидің шыққан өңірі қай қала атауымен байланысты?","options":["Отырар–Фараб","Сарай-Бату","Қарақорым","Имақия"],"explanation":"Ғалымның «әл-Фараби» аты Фараб өңірімен байланысты.","id":236},{"topic":5,"origin":"","sources":["farabi"],"question":"«Екінші ұстаз» атанған ортағасырлық ғалым кім?","options":["Әл-Фараби","Мұхаммед Шайбани","Едіге","Бұқар жырау"],"explanation":"Бұл атақ әл-Фарабидің философия мен ғылымдағы беделін білдіреді; «бірінші ұстаз» — Аристотель.","id":237},{"topic":5,"origin":"","sources":["farabi"],"question":"Әл-Фараби мұрасын дұрыс сипаттайтын жауап қайсы?","options":["Философия, логика, музыка және басқа ғылымдар","Тек әскери жарлықтар жинағы","Тек хан әулетінің шежіресі","Тек теңіз саяхаттарының күнделігі"],"explanation":"Әл-Фараби көптеген ғылым салаларын зерттеген энциклопедист ойшыл болды.","id":238},{"topic":5,"origin":"","sources":["kashgari"],"question":"«Диуани лұғат ат-түрк» еңбегінің негізгі сипаты қандай?","options":["Түркі тілдерінің сөздігі","Алым-салық туралы жарлық","Тек құрылыс өлшемдерінің кестесі","Теңіз бағыттарының картасы"],"explanation":"Сөздік тілдік деректермен бірге түркілердің мәдениеті мен тұрмысынан мәлімет береді.","id":239},{"topic":5,"origin":"","sources":["runic"],"question":"1893 жылы көне түркі жазуының оқылу кілтін тапқан ғалым кім?","options":["Вильгельм Томсен","Григорий Потанин","Петр Семенов","Александр Гейнс"],"explanation":"Томсен Орхон жазуын дешифрлаумен танылды.","id":240},{"topic":5,"origin":"","sources":["T:3","T:27"],"question":"Күлтегін, Білге қаған және Тоныкөк жазбалары тарихшы үшін қандай дерек?","options":["Жазба тарихи дерек","Тек ауызша аңыз","Қазіргі статистикалық есеп","Еуропалық теңіз картасы"],"explanation":"Тасқа қашалған мәтіндер түркі билігі, қоғамы және оқиғалары туралы тікелей жазба мәлімет береді.","id":241},{"topic":5,"origin":"","sources":["goldliterature"],"question":"«Хұсрау–Шырын» дастанының Алтын Орда дәуіріндегі түркі нұсқасын жазған ақын кім?","options":["Құтб","Хорезми","Сайф Сараи","Дулати"],"explanation":"Құтб Низами сюжетін түркі әдеби ортасына бейімдеген.","id":242},{"topic":5,"origin":"","sources":["goldliterature"],"question":"«Гүлстан бит-түрки» шығармасымен байланысты ақын кім?","options":["Сайф Сараи","Жүсіп Баласағұни","Махмұд Қашғари","Шалкиіз"],"explanation":"Сайф Сараи Сағдидің «Гүлстанын» түркі тіліне бейімдеп, әдеби мұра қалдырған.","id":243},{"topic":5,"origin":"","sources":["goldliterature"],"question":"«Қисса-сүл-әнбия» туындысының авторы кім?","options":["Рабғузи","Құтб","Бұқар жырау","Махамбет"],"explanation":"Рабғузи шығармасында пайғамбарлар туралы қиссалар жинақталған.","id":244},{"topic":5,"origin":"","sources":["dulati"],"question":"«Тарих-и Рашиди» негізінен қай мемлекеттің тарихы туралы мәлімет береді?","options":["Моғолстанның","Батыс Түрік қағанатының","Жоңғар хандығының","Бөкей Ордасының"],"explanation":"Дулати Моғолстан мен көршілес аймақтарды баяндап, Қазақ хандығының құрылуына да тоқталады.","id":245},{"topic":5,"origin":"","sources":["silk"],"question":"Ұлы Жібек жолының тарихи қызметін толық көрсететін жауап қайсы?","options":["Саудамен бірге мәдениет пен білім алмасуын қамтамасыз ету","Тек әскери жорықтарға қызмет ету","Тек бір мемлекеттің ішкі жолы болу","Барлық қалаларды көшпелі қонысқа айналдыру"],"explanation":"Құрлық жолдары тауарларды, діни идеяларды және мәдени жетістіктерді таратты.","id":246},{"topic":5,"origin":"","sources":["silk"],"question":"Ежелгі «нефрит жолы» қай аймақтар арасындағы байланыспен аталады?","options":["Шығыс Түркістан мен Қытай","Еділ бойы мен Скандинавия","Мысыр мен Батыс Африка","Сібір мен Америка"],"explanation":"Нефрит Шығыс Түркістаннан Қытайға жеткізілген бағалы тас болды.","id":247},{"topic":5,"origin":"","sources":["silk"],"question":"Лазурит пен нефрит қандай тауар түріне жатады?","options":["Бағалы әшекей тастарға","Дәнді дақылдарға","Киіз бұйымдарына","Әскери атақтарға"],"explanation":"Бұл тастардан әшекейлер мен сәндік бұйымдар жасалған.","id":248},{"topic":5,"origin":"","sources":["cities"],"question":"Ортағасырлық қаланың билеуші орналасқан бекіністі бөлігі қалай аталады?","options":["Цитадель","Рабад","Жайлау","Қыстау"],"explanation":"Цитадель — қаланың ішкі қорғаны және билік орталығы.","id":249},{"topic":5,"origin":"","sources":["cities"],"question":"Ортағасырлық қаланың қолөнершілер мен саудагерлер қоныстанған сыртқы бөлігі қайсы?","options":["Рабад","Цитадель","Құрылтай","Ұлыс"],"explanation":"Рабад қаланың сыртқы тұрғын және сауда-қолөнер аймағын білдіреді.","id":250},{"topic":5,"origin":"","sources":["cities"],"question":"Отырар, Тараз, Сығанақ сияқты қалалардың өсуіне не ықпал етті?","options":["Сауда жолдары, суармалы егіншілік және қолөнер","Тек мұхит порттарының болуы","Өнеркәсіптік теміржолдардың салынуы","Қалалардың барлық ауылдан оқшаулануы"],"explanation":"Қалалар отырықшы және көшпелі шаруашылық арасындағы айырбастың орталығы болды.","id":251},{"topic":5,"origin":"","sources":["T:9","T:10","G:15"],"question":"Дала мен қала арасындағы айырбасқа тән жұпты таңда.","options":["Мал өнімдері ↔ астық пен қолөнер бұйымдары","Мұнай құбыры ↔ ұшақ қозғалтқышы","Тек теңіз балығы ↔ мұхит кемесі","Тек қағаз ақша ↔ теміржол билеті"],"explanation":"Көшпелі мал шаруашылығы мен қалалық қолөнер, егіншілік бірін-бірі толықтырды.","id":252},{"topic":6,"origin":"3:1","sources":["expedition"],"question":"1734 жылы құрылған Қырғыз-қайсақ (Орынбор) экспедициясының міндеттерінің бірі қандай болды?","options":["Кіші жүз аумағын зерттеу","Жетісуда Түргеш қағанатын құру","Бұхарада медресе ашу","Сібір хандығын қайта құру"],"explanation":"Экспедиция Кіші жүзді зерттеп, Ресейдің аймақтағы ықпалын нығайтуға бағытталды.","id":253},{"topic":6,"origin":"3:4","sources":["janqozha"],"question":"Жанқожа Нұрмұхамедұлы бастаған көтеріліс қай өңірде болды?","options":["Сырдарияның төменгі ағысында","Ертістің жоғарғы ағысында","Жетісудың шығысында","Есілдің жоғарғы ағысында"],"explanation":"Жанқожа күресі Сыр бойындағы отарлық қысымға қарсы бағытталды.","id":254},{"topic":6,"origin":"3:11","sources":["reform1854"],"question":"Қай жылдан бастап аға сұлтандыққа Шыңғыс әулетінен емес адамдар да сайлана алды?","options":["1854 жылдан","1824 жылдан","1833 жылдан","1864 жылдан"],"explanation":"Оқу материалында бұл өзгеріс 1854 жылмен көрсетіледі.","id":255},{"topic":6,"origin":"3:18","sources":["bulanty"],"question":"Бұланты–Білеуті шайқасы өткен Қарасүйір маңы жеңістен кейін қалай аталды?","options":["Қалмаққырылған","Ордабасы","Аңырақай","Қозыбасы"],"explanation":"Фотода берілген жер — Қарасүйір. Жеңістен кейінгі атауы — Қалмаққырылған.","id":256},{"topic":6,"origin":"3:21","sources":["embassy1717"],"question":"Оқу материалында 1717 жылы Қазақ даласына келген орыс елшілері ретінде кімдер аталады?","options":["Борис Брянцев пен Федор Жилин","Колмаков пен Урусов","Лаппа мен Северцев","Карелин мен Семенов"],"explanation":"Мектептік оқу материалында 1717 жылғы елшілік Б арқан, Тараз, Битөбе"],"explanation":"Жоңғар шапқыншылығы Ташкент, Сайрам және Түркістан өңірлерін де қамтыды.","id":263},{"topic":6,"origin":"4:7","sources":["turkestan"],"question":"1867 жылы құрылған, Сырдария мен Жетісу облыстары кірген генерал-губернаторлық қайсы?","options":["Түркістан","Батыс Сібір","Орынбор","Дала"],"explanation":"Фотодағы 1866 жылғы аумақтардың қосылуы туралы сұрақ нақты 1867 жылғы әкімшілік құрылыммен ауыстырылды.","id":264},{"topic":6,"origin":"4:8","sources":["isatay"],"question":"1836–1838 жылдардағы Исатай–Махамбет көтерілісінің негізгі себептерінің бірі қандай?","options":["Жер тапшылығы және алым-салық қысымы","Махамбеттің 1846 жылы өлтірілуі","Жәңгірдің 1845 жылы қайтыс болуы","1867 жылғы реформаның қабылдануы"],"explanation":"Фотодағы төрт нұсқада дұрыс себеп жоқ. Кейінгі оқиғалар 1836 жылы басталған көтерілістің себебі бола алмайды.","id":265},{"topic":6,"origin":"4:9","sources":["janqozha"],"question":"1857 жылы Жанқожаға қарсы Фитингофт отрядындағы негізгі екі әскери топтың құрамы қандай болды?","options":["300 атты казак және 320 жаяу әскер","600 атты казак және 520 жаяу әскер","400 атты казак және 420 жаяу әскер","900 атты казак және 720 жаяу әскер"],"explanation":"Деректе 300 атты казак пен 320 жаяу әскер көрсетіледі; бұлар отрядтағы барлық қосымша күшті қамтымайды.","id":266},{"topic":6,"origin":"4:14","sources":["kalmyk1771"],"question":"1771 жылы Еділден шығысқа, Қытай шекарасына қарай көшкен халық қайсы?","options":["Еділ қалмақтары","Башқұрттар","Енисей қырғыздары","Украиндар"],"explanation":"1771 жылғы Еділ қалмақтарының шығысқа көшуі «Шаңды жорық» оқиғасымен байланысты.","id":267},{"topic":6,"origin":"4:16","sources":["tax1837"],"question":"Кіші жүзде 1837 жылы енгізілген түтін салығының жылдық мөлшері қанша болды?","options":["1 сом 50 тиын","2 сом 50 тиын","3 сом 50 тиын","5 сом"],"explanation":"Фотода 1824 жыл деп берілген. 1 сом 50 тиын мөлшеріндегі түтін салығы деректе 1837 жылға қатысты көрсетіледі.","id":268},{" ақ–орыс дипломатиялық байланыстарының бір себебі қайсы?","options":["Жоңғар қаупіне қарсы одақ іздеу","Қарахан мемлекетін құру","Шыңғыс ханның таққа келуіне көмектесу","Орхон жазуын енгізу"],"explanation":"Сыртқы қауіп қазақ билеушілерін көрші мемлекеттермен байланыс орнатуға итермеледі.","id":275},{"topic":6,"origin":"","sources":["expedition"],"question":"1734 жылғы Орынбор экспедициясының алғашқы басшысы кім?","options":["Иван Кириллов","Михаил Сперанский","Карл Гекке","Вильгельм Томсен"],"explanation":"Кириллов экспедициясы өлкені зерттеу және Ресей ықпалын кеңейту міндеттерімен құрылған.","id":276},{"topic":6,"origin":"","sources":["cossacks"],"question":"Казак әскери шептерінің Қазақстандағы басты қызметтерінің бірі қандай болды?","options":["Империялық шекараны күзету және отарлық тірек болу","Қазақ хандарын тәуелсіз сайлау","Моңғол ұлыстарын басқару","Тек мешіттер салу"],"explanation":"Әскери шептер Ресейдің өңірдегі бақылауын нығайтты.","id":277},{"topic":6,"origin":"","sources":["syrym"],"question":"Сырым Датұлы бастаған көтеріліс қай жылдары болды?","options":["1783–1797 жылдары","1836–1838 жылдары","1837–1847 жылдары","1856–1857 жылдары"],"explanation":"Сырым қозғалысы XVIII ғасырдың соңындағы Кіші жүз тарихына жатады.","id":278},{"topic":6,"origin":"","sources":["syrym"],"question":"Сырым Датұлы бастаған қозғалыс негізінен қай жүзде өтті?","options":["Кіші жүзде","Ұлы жүзде","Орта жүзде","Тек Жетісу ұйғырлары арасында"],"explanation":"Көтеріліс Жайық маңындағы жер мәселесі және отарлық қысыммен байланысты болды.","id":279},{"topic":6,"origin":"","sources":["syrym"],"question":"Сырым көтерілісінің негізгі себептерінің бірі қайсы?","options":["Жайылымдарды пайдалану шектелуі және отарлық қысым","Жоңғар мемлекетінің 1635 жылы құрылуы","Қарахан мемлекетінің исламды қабылдауы","Алтын Орданың батысқа жорығы"],"explanation":"Жер мен көшу жолдары үшін күрес қозғалыстың әлеуметтік негізін күшейтті.","id":280},{"topic":6,"origin":"","sources":["bokei"],"question":"Бөкей Ордасы қай жылы құрылды?","options":["1801 жылы","1731 жылы","1822 жылы","1867 жылы"],"explanation":"1801 жылы Бөкей бастаған қазақтардың Еділ мен Жайық аралығына өтуіне рұқсат берілді.","id":281},{"topic":6,"origin":"","sources":["bokei"],"question":"Бөкей Ордасы қай екі өзен аралығында орналасты?","options":["Еділ мен Жайық","Шу мен Талас","Ертіс пен Есіл","Сырдария мен Әмудария"],"explanation":"Ішкі Орда Еділ–Жайық аралығында қалыптасты.","id":282},{"topic":6,"origin":"","sources":["reform1822"],"question":"1822 жылғы «Сібір қырғыздары туралы жарғы» қай жүздегі хандық билікті жоюға бағытталды?","options":["Орта жүздегі","Ұлы жүздегі","Кіші жүздегі","Үш жүзде бір күнде"],"explanation":"1822 жылғы жарғы Орта жүзді округтік басқаруға көшіруді көздеді.","id":283},{"topic":6,"origin":"","sources":["reform1822"],"question":"1822 жылғы жарғы жобасын әзірлеумен байланысты қайраткер кім?","options":["Михаил Сперанский","Иван Кириллов","Алексей Тевкелев","Иван Бухгольц"],"explanation":"Сперанский басшылығымен дайындалған реформа империялық әкімшілік жүйені енгізді.","id":284},{"topic":6,"origin":"","sources":["tax1837"],"question":"Кіші жүздегі хандық билікті жойған реформа қай жылы қабылданды?","options":["1824 жылы","1801 жылы","1837 жылы","1868 жылы"],"explanation":"1824 жылғы Орынбор реформасы Кіші жүздегі хандық билікті жойды; түтін салығының 1837 жылғы енгізілуімен шатастырмаңыз.","id":285},{"topic":6,"origin":"","sources":["isatay"],"question":"1836–1838 жылдардағы көтерілісті Исатаймен бірге басқарған ақын кім?","options":["Махамбет Өтемісұлы","Бұқар Қалқаманұлы","Жүсіп Баласағұни","Шалкиіз Тіленшіұлы"],"explanation":"Махамбет көтерілістің басшыларының бірі әрі оның рухын жырлаған ақын болды.","id":286},{"topic":6,"origin":"","sources":["isatay"],"question":"Исатай–Махамбет көтерілісінің 1837 жылғы ірі шайқасы қай жерде өтті?","options":["Тастөбеде","Орбұлақта","Атлахта","Қозыбасыда"],"explanation":"Тастөбе шайқасы 1837 жылғы қарашада өтіп, көтерілістің бірінші кезеңіне ауыр соққы болды.","id":287},{"topic":6,"origin":"","sources":["isatay"],"question":"Исатай Тайманұлы 1838 жылы қай шайқаста қаза тапты?","options":["Ақбұлақ шайқасында","Бұланты шайқасында","Куликово шайқасында","Атлах шайқасында"],"explanation":"1838 жылғы 12 шілдедегі Ақбұлақ шайқасында Исатай қаза тапты.","id":288},{"topic":6,"origin":"","sources":["kenesary"],"question":"Кенесары Қасымұлы бастаған көтерілістің жылдары қайсы?","options":["1837–1847","1783–1797","1836–1838","1868–1869"],"explanation":"Он жылға созылған қозғалыс қазақ мемлекеттілігін сақтап, отарлық қысымды тоқтатуға ұмтылды.","id":289},{"topic":6,"origin":"","sources":["kenesary"],"question":"Кенесары Қасымұлы хан болып қай жылы сайланды?","options":["1841 жылы","1822 жылы","1836 жылы","1867 жылы"],"explanation":"1841 жылғы хан сайлауы Кенесары қозғалысының саяси маңызын көрсетті.","id":290},{"topic":6,"origin":"","sources":["kenesary"],"question":"Кенесары қозғалысының басты саяси мақсаттарының бірі қандай болды?","options":["Қазақ жерінің тұтастығын және хандық мемлекеттілікті қалпына келтіру","Түргеш мемлекетін қалпына келтіру","Алтын Орданы Еуропаға көшіру","Ляо әулетін Қытайда қайта орнату"],"explanation":"Қозғалыс отарлық басқаруға және қазақ жеріндегі бекіністер арқылы бақылаудың күшеюіне қарсы тұрды.","id":291},{"topic":6,"origin":"","sources":["janqozha"],"question":"Жанқожа Нұрмұхамедұлының Ресей билігіне қарсы көтерілісі қай жылдары болды?","options":["1856–1857 жылдары","1723–1727 жылдары","1783–1797 жылдары","1836–1838 жылдары"],"explanation":"Бұл қозғалыс Сырдарияның төменгі ағысында өрбіді.","id":292},{"topic":6,"origin":"","sources":["reform1867"],"question":"1867–1868 жылдардағы реформалар бойынша қазақ жерінің негізгі бөлігі неше генерал-губернаторлыққа бөлінді?","options":["Үш","Екі","Төрт","Бес"],"explanation":"Олар — Орынбор, Батыс Сібір және Түркістан генерал-губернаторлықтары.","id":293},{"topic":6,"origin":"","sources":["reform1867"],"question":"1867–1868 жылдары Орал және Торғай облыстары қай генерал-губернаторлыққа қарады?","options":["Орынборға","Түркістанға","Батыс Сібірге","Кавказға"],"explanation":"Орал мен Торғай Орынбор генерал-губернаторлығына біріктірілді.","id":294},{"topic":6,"origin":"","sources":["reform1867"],"question":"1867–1868 жылдары Ақмола мен Семей облыстары қай генерал-губернаторлыққа қарады?","options":["Батыс Сібірге","Орынборға","Түркістанға","Далаға"],"explanation":"Бұл кезеңде Ақмола мен Семей Батыс Сібір генерал-губернаторлығына кірді; Дала генерал-губернаторлығы кейін құрылды.","id":295},{"topic":6,"origin":"","sources":["reform1867"],"question":"1867–1868 жылдардағы басқару сатыларының дұрыс реті қайсы?","options":["Генерал-губернаторлық → облыс → уезд → болыс → ауыл","Облыс → ауыл → генерал-губернаторлық → уезд → болыс","Ауыл → хандық → облыс → ұлыс → уезд","Уезд → қағанат → ауыл → болыс → облыс"],"explanation":"Реформа бес сатылы империялық әкімшілік жүйені енгізді.","id":296},{"topic":6,"origin":"","sources":["reform1867"],"question":"1867–1868 жылдардағы реформалар жердің құқықтық мәртебесін қалай өзгертті?","options":["Қазақ жері Ресей империясының мемлекеттік меншігі деп жарияланды","Барлық жер дербес хандарға қайтарылды","Жер толығымен қала қолөнершілеріне берілді","Салық пен әкімшілік бақылау толық жойылды"],"explanation":"Мемлекеттік меншік туралы қағида кейінгі отарлық жер саясатына құқықтық негіз болды.","id":297},{"topic":6,"origin":"","sources":["isatay","kenesary","janqozha"],"question":"Көтерілістерді басталу уақыты бойынша дұрыс ретпен таңда.","options":["Исатай–Махамбет → Кенесары → Жанқожа","Жанқожа → Кенесары → Исатай–Махамбет","Кенесары → Жанқожа → Исатай–Махамбет","Жанқожа → Исатай–Махамбет → Кенесары"],"explanation":"Басталу жылдары: 1836, 1837 және 1856.","id":298},{"topic":6,"origin":"","sources":["reform1822","tax1837","reform1867"],"question":"Реформаларды уақыт ретімен көрсет.","options":["1822 Орта жүз → 1824 Кіші жүз → 1867–1868 әкімшілік реформа","1824 Кіші жүз → 1867–1868 реформа → 1822 Орта жүз","1867–1868 реформа → 1822 Орта жүз → 1824 Кіші жүз","1822 Орта жүз → 1867–1868 реформа → 1824 Кіші жүз"],"explanation":"Алдымен хандық билік жойылып, кейін империялық облыстық басқару кеңейтілді.","id":299},{"topic":6,"origin":"","sources":["bokei","isatay","kenesary"],"question":"Тұлға мен оқиғаны дұрыс сәйкестендірген қатарды таңда.","options":["Бөкей — Ішкі Орда; Исатай — 1836–1838 көтеріліс; Кенесары — 1841 хан сайлауы","Бөкей — Атлах; Исатай — Қарахан; Кенесары — 1465 хандық құрылуы","Бөкей — Алтын Орда; Исатай — 1734 экспедиция; Кенесары — 1822 жарғысы","Бөкей — 1867 реформа; Исатай — 1206 құрылтай; Кенесары — Оғыз мемлекеті"],"explanation":"Үш сәйкестік те XIX ғасырдың бірінші жартысындағы оқиғаларға қатысты.","id":300}]}</script>
<script>
(() => {
'use strict';
const DATA=JSON.parse(document.getElementById('quizData').textContent);
const QUESTIONS=DATA.questions, TOPICS=DATA.topics, SOURCES=DATA.sources;
const BY_ID=new Map(QUESTIONS.map(q=>[q.id,q]));
const KEY='tarih300-2026-v1';
const app=document.getElementById('app');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const fresh=()=>({version:1,bookmarks:[],outcomes:{},reviewQueue:[],history:[],session:null,settings:{topic:'all',pool:'all',limit:'all',mode:'learn',shuffle:true}});
let storageOK=true, state=fresh(), view='home', clockAt=null, ticks=0, toastTimer=null, dialogAction=null;
let bank={topic:'all',pool:'all',search:'',limit:20}, reviewFilter='errors', reviewLimit=30;
function shuffle(array,rng=Math.random){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function validIds(a){return Array.isArray(a)?[...new Set(a)].filter(id=>BY_ID.has(id)):[];}
function readState(){
 try{
  const raw=localStorage.getItem(KEY); if(!raw)return;
  const s=JSON.parse(raw); if(!s||s.version!==1)return;
  state.bookmarks=validIds(s.bookmarks);state.reviewQueue=validIds(s.reviewQueue);
  if(s.outcomes&&typeof s.outcomes==='object')for(const [id,v]of Object.entries(s.outcomes))if(BY_ID.has(+id)&&typeof v==='boolean')state.outcomes[id]=v;
  if(Array.isArray(s.history))state.history=s.history.slice(-10);
  if(s.settings){
   if(s.settings.topic==='all'||TOPICS.some(t=>String(t.id)===String(s.settings.topic)))state.settings.topic=String(s.settings.topic);
   if(['all','photo','v3','v4','bookmarks','weak'].includes(s.settings.pool))state.settings.pool=s.settings.pool;
   if(['30','60','100','all'].includes(String(s.settings.limit)))state.settings.limit=String(s.settings.limit);
   if(['learn','exam'].includes(s.settings.mode))state.settings.mode=s.settings.mode;
   if(typeof s.settings.shuffle==='boolean')state.settings.shuffle=s.settings.shuffle;
  }
  const z=s.session;
  if(z&&Array.isArray(z.ids)&&z.ids.length&&validIds(z.ids).length===z.ids.length&&['learn','exam'].includes(z.mode)&&z.orders&&z.answers&&typeof z.answers==='object'){
   const ordersOK=z.ids.every(id=>Array.isArray(z.orders[id])&&z.orders[id].length===4&&[0,1,2,3].every(n=>z.orders[id].includes(n)));
   const answersOK=Object.entries(z.answers).every(([id,n])=>z.ids.includes(+id)&&Number.isInteger(n)&&n>=0&&n<4);
   if(ordersOK&&answersOK)state.session={ids:z.ids,orders:z.orders,answers:z.answers,index:Math.min(Math.max(Number.isInteger(z.index)?z.index:0,0),z.ids.length-1),mode:z.mode,completed:!!z.completed,elapsedMs:Number.isFinite(z.elapsedMs)?Math.max(0,z.elapsedMs):0,startedAt:z.startedAt||Date.now()};
  }
 }catch(e){if(e.name!=='SyntaxError')storageOK=false;}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}document.getElementById('storageWarning').classList.toggle('hidden',storageOK);}
function notice(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2400);}
function topic(id){return TOPICS.find(t=>t.id===+id);}
function poolMatches(q,pool){return pool==='all'||(pool==='photo'&&q.origin)||(pool==='v3'&&q.origin.startsWith('3:'))||(pool==='v4'&&q.origin.startsWith('4:'))||(pool==='bookmarks'&&state.bookmarks.includes(q.id))||(pool==='weak'&&state.reviewQueue.includes(q.id));}
function filtered(settings){return QUESTIONS.filter(q=>(settings.topic==='all'||q.topic===+settings.topic)&&poolMatches(q,settings.pool));}
function sourceHTML(q){return '<div class="refs">'+q.sources.map(s=>{
 if(s.includes(':')){const [code,page]=s.split(':');return '<span>'+escape(DATA.documents[code])+' · '+escape(page)+'-бет</span>';}
 const x=SOURCES[s];return '<a href="'+escape(x.url)+'" target="_blank" rel="noopener noreferrer">'+escape(x.title)+' ↗</a>';
}).join('')+'</div>';}
function originText(q){return q.origin?'Сурет: '+q.origin.split(':')[0]+'-нұсқа, '+q.origin.split(':')[1]+'-сұрақ':'Тақырыпты кеңейту';}
function optionHTML(value,label,current){return '<option value="'+escape(value)+'"'+(String(value)===String(current)?' selected':'')+'>'+escape(label)+'</option>';}
function poolOptions(current){return [['all','Барлық сұрақ'],['photo','Сурет негізіндегі 60'],['v3','3-нұсқа · 30 сұрақ'],['v4','4-нұсқа · 30 сұрақ'],['bookmarks','Белгіленгендер · '+state.bookmarks.length],['weak','Қайталау керек · '+state.reviewQueue.length]].map(([a,b])=>optionHTML(a,b,current)).join('');}
function topicOptions(current){return optionHTML('all','Барлық тақырып',current)+TOPICS.map(t=>optionHTML(t.id,t.name,current)).join('');}
function countChosen(){const n=filtered(state.settings).length;return state.settings.limit==='all'?n:Math.min(n,+state.settings.limit);}
function formatTime(ms){const n=Math.floor(ms/1000),h=Math.floor(n/3600),m=Math.floor(n/60)%60,s=n%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function flushClock(){if(clockAt!==null&&state.session&&!state.session.completed){const now=Date.now();state.session.elapsedMs+=Math.max(0,now-clockAt);clockAt=now;}}
function pauseClock(){flushClock();clockAt=null;persist();}
function updateNav(){document.querySelectorAll('.navlinks button').forEach(b=>{if(b.dataset.nav===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function setView(next){if(view==='quiz'&&next!=='quiz')pauseClock();view=next;updateNav();if(view==='home')renderHome();if(view==='quiz')renderQuiz(true);if(view==='result')renderResult();if(view==='bank')renderBank();if(view==='sources')renderSources();window.scrollTo({top:0,behavior:'instant'});}
function renderHome(){
 const s=state.settings,n=countChosen(),available=filtered(s).length,z=state.session;
 const attempted=Object.keys(state.outcomes).length, learned=Object.values(state.outcomes).filter(Boolean).length;
 app.innerHTML=(z?'<div class="resume"><div><strong>'+(z.completed?'Соңғы сессия сақталған':'Бастаған жеріңізден жалғастырыңыз')+'</strong><p>'+Object.keys(z.answers).length+' / '+z.ids.length+' жауап · '+(z.mode==='learn'?'Оқу режимі':'Сынақ режимі')+' · '+formatTime(z.elapsedMs)+'</p></div><button class="btn small" data-action="resume">'+(z.completed?'Нәтижені ашу':'Жалғастыру →')+'</button></div>':'')+

 if(state.session&&!state.session.completed&&Object.keys(state.session.answers).length)confirmAction('Жаңа сессия басталсын ба?','Бұрынғы сессияның орнын жаңасы басады. Оқу режиміндегі жауаптар мен белгіленген сұрақтар сақталады.','Жаңасын бастау',begin);else begin();
}

function summarize(z){const correct=z.ids.filter(id=>z.answers[id]===0).length,answered=z.ids.filter(id=>own(z.answers,id)).length;return{total:z.ids.length,correct,wrong:answered-correct,blank:z.ids.length-answered,answered,percent:Math.round(correct/z.ids.length*100),review:z.ids.filter(id=>!own(z.answers,id)||z.answers[id]!==0)};}
function finish(){const z=state.session;if(!z||z.completed)return;pauseClock();z.completed=true;for(const id of z.ids){if(own(z.answers,id))setOutcome(id,z.answers[id]===0);else if(!state.reviewQueue.includes(id))state.reviewQueue.push(id);}const result=summarize(z);state.history.push({date:Date.now(),total:result.total,correct:result.correct});state.history=state.history.slice(-10);reviewFilter='errors';reviewLimit=30;persist();setView('result');}

function renderSources(){
 app.innerHTML='<div class="pagehead"><div><div class="eyebrow">Нені негізге алдық?</div><h1>Дереккөздер мен нақтылаулар</h1><p>300 сұрақ = сурет негізіндегі 60 сұрақ + тақырыпты кеңейтетін 240 сұрақ.</p></div></div><div class="notices"><section class="notice"><h2>Жіберілген материалдар</h2><ul class="source-list"><li>3-нұсқа: 1–30-сұрақ; 4-нұсқа: 1–30-сұрақ. Қайталанған фотолар қайта саналмады.</li>'+Object.values(DATA.documents).map(x=>'<li>'+escape(x)+'</li>').join('')+'</ul><p>PDF сілтемелерінде файл ішіндегі беттердің реттік нөмірі берілген. Олар бастапқы файлға қатысты; HTML ішінде PDF көшірмелері сақталмаған. Қосымша интернет деректері төменде көрсетілген.</p></section><section class="notice"><h2>Фотодағы сұрақтар қалай нақтыланды?</h2><p class="hint">Квиз бастапқы сұрақтардың тақырыбын сақтайды. Төмендегі тұстар сөзбе-сөз көшірілмеді: екіұштылық пен қате жауаптар түзетілді. Нақтылау әр тиісті сұрақтың түсіндірмесінде де бар.</p><div class="tablewrap"><table><thead><tr><th>Бастапқы сұрақ</th><th>Квиздегі нақтылау</th></tr></thead><tbody><tr><td>3-нұсқа, 5</td><td>Лазурит пен нефрит жолдары ажыратылды; сұрақ лазурит бағытына қойылды.</td></tr><tr><td>3-нұсқа, 9</td><td>Оғыз даласының кең шекарасы орнына Қазақстандағы негізгі қоныстар — төменгі Сыр, Арал маңы және Солтүстік Каспий — сұралды.</td></tr><tr><td>3-нұсқа, 16</td><td>Мерзімі екіұшты тұжырым көне түркі жазуының атауын тануға ауыстырылды.</td></tr><tr><td>3-нұсқа, 19 және 25</td><td>Туыстарды тағайындау және артықшылықтардың аяқталуы туралы жалпылама тұжырымдар нақты тарихи атау мен әлеуметтік ұғымға ауыстырылды.</td></tr><tr><td>3-нұсқа, 20</td><td>Бұқар туралы қайталанған сұрақ оның әкесінің атымен толықтырылды.</td></tr><tr><td>4-нұсқа, 7</td><td>1866 жылғы аумақтар туралы тұжырым орнына 1867 жылғы Түркістан генерал-губернаторлығы сұралды.</td></tr><tr><td>4-нұсқа, 8</td><td>1836–1838 көтерілістің себебі — жер тапшылығы, салық пен билік қысымы. 1845, 1846 және 1867 жылғы оқиғалар одан кейін болды.</td></tr><tr><td>4-нұсқа, 10 және 12</td><td>Іскердің алынуы — 1582 жыл; VI–XV ғасырлар — бүкіл этногенез емес, шамамен мың жылдық түркілік кезең.</td></tr><tr><td>4-нұсқа, 16</td><td>Кіші жүздегі 1 сом 50 тиын түтін салығы 1837 жылға қатысты. 1824 жыл — хандық билікті жойған реформа.</td></tr><tr><td>4-нұсқа, 25 және 29</td><td>Тәуекелдің нақты 1598 жылғы жорығы және Алаша хан кесенесінің орналасуы сұралды. Кесененің мерзімделуі зерттеулерде әртүрлі.</td></tr></tbody></table></div><p>Кейбір билік жылдары мен оқиғалардың мерзімі оқу дәстүріне қарай беріледі: мұндай жерде «дәрісте» немесе «оқу әдебиетінде» деп көрсетілді. Бұл оқу құралы; нақты рубежка сұрақтары дәл осындай болады дегенді білдірмейді.</p></section><section class="notice"><h2>Қосымша дереккөздер</h2><p class="hint">Әр сұрақтың түсіндірмесінде тиісті дерек көрсетілген. Сыртқы сілтемелер интернет болғанда ашылады.</p><ul class="source-list">'+Object.values(SOURCES).map(s=>'<li><a href="'+escape(s.url)+'" target="_blank" rel="noopener noreferrer">'+escape(s.title)+' ↗</a></li>').join('')+'</ul></section><section class="notice"><h2>Қалай тиімді қайталау керек?</h2><p>Әуелі сурет негізіндегі 60 сұрақты оқу режимінде өтіңіз. Содан кейін алты тақырыпты кезекпен қайталап, аралас сынақ тапсырыңыз. Соңында «Қате мен бос сұрақтарды қайталау» батырмасымен әлсіз тұстарды бекітіңіз.</p><p class="hint">Сақтау осы браузерге және файлдың орнына байланысты. Жеке шолу режимінде, файлды басқа орынға көшіргенде немесе браузер деректерін тазалағанда ілгерілеу сақталмауы мүмкін.</p></section></div><div class="sectionhead"><button class="btn primary" data-nav="home">Дайындыққа оралу →</button></div>';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){setView(b.dataset.nav);return;}
 if(b.dataset.topic){state.settings.topic=b.dataset.topic;persist();renderHome();return;}
 if(b.dataset.mode){state.settings.mode=b.dataset.mode;persist();renderHome();return;}
 if(b.dataset.bookmark){toggleBookmark(+b.dataset.bookmark);return;}
 if(b.dataset.option!==undefined){choose(+b.dataset.option);return;}
 if(b.dataset.jump!==undefined){move(+b.dataset.jump);return;}
 const a=b.dataset.action;if(!a)return;
 if(a==='allTopics'){state.settings.topic='all';persist();renderHome();}
 if(a==='start')startConfigured();
 if(a==='resume')setView(state.session.completed?'result':'quiz');
 if(a==='photo60')newSession(QUESTIONS.filter(q=>q.origin).map(q=>q.id));
 if(a==='weak')newSession(state.reviewQueue,'learn',true);
 if(a==='prev')move(state.session.index-1);
 if(a==='next'){if(state.session.index===state.session.ids.length-1)requestFinish();else move(state.session.index+1);}
 if(a==='finish')requestFinish();
 if(a==='retry')newSession(summarize(state.session).review,'learn',true);
 if(a==='moreBank'){bank.limit+=20;renderBankList();}
 if(a==='moreReview'){reviewLimit+=30;renderResult();}
});
document.addEventListener('change',e=>{
 const id=e.target.id,value=e.target.value;
 if(id==='pool'||id==='limit'){state.settings[id]=value;persist();renderHome();}
 if(id==='shuffle'){state.settings.shuffle=e.target.checked;persist();}
 if(id==='bankTopic'){bank.topic=value;bank.limit=20;renderBankList();}
 if(id==='bankPool'){bank.pool=value;bank.limit=20;renderBankList();}
 if(id==='reviewFilter'){reviewFilter=value;reviewLimit=30;renderResult();}
});
document.addEventListener('input',e=>{if(e.target.id==='bankSearch'){bank.search=e.target.value;bank.limit=20;renderBankList();}});
document.addEventListener('keydown',e=>{
 if(view!=='quiz'||document.getElementById('dialog').open||e.altKey||e.ctrlKey||e.metaKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
 const z=state.session;if(!z||z.completed)return;
 if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(z.orders[z.ids[z.index]][+e.key-1]);}
 if(e.key==='ArrowLeft'){e.preventDefault();move(z.index-1);}
 if(e.key==='ArrowRight'){e.preventDefault();if(z.index<z.ids.length-1)move(z.index+1);}
});
document.getElementById('dialogCancel').addEventListener('click',()=>{document.getElementById('dialog').close();dialogAction=null;});
document.getElementById('dialogOK').addEventListener('click',()=>{const fn=dialogAction;document.getElementById('dialog').close();dialogAction=null;if(fn)fn();});
document.getElementById('dialog').addEventListener('cancel',()=>{dialogAction=null;});
window.addEventListener('pagehide',()=>{flushClock();persist();});
setInterval(()=>{if(view==='quiz'&&clockAt!==null){flushClock();const el=document.getElementById('clock');if(el)el.textContent=formatTime(state.session.elapsedMs);if(++ticks%10===0)persist();}},1000);
readState();persist();setView('home');
// Pure helpers and state snapshots also make the standalone file verifiable.
window.TarihQuiz={createSession,summarize,shuffle,filtered,getState:()=>JSON.parse(JSON.stringify(state)),getView:()=>view,getData:()=>DATA,start:newSession,choose,move,finish,setView};
})();
